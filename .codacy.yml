# Codacy 分析范围：排除测试文件与测试目录，避免测试夹具和用例触发生产代码规则。
# 规则、工具与依赖配置仍由仓库根目录的其它配置文件维护，这里只声明排除路径。
---
exclude_paths:
  - "tests/**"
  - "test/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/__tests__/**"
  - "**/__test__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*.spec.js"
  - "**/*.spec.jsx"
  # 锁文件由包管理器与依赖安全更新维护，字符串扫描会把包名 js-tokens 误判为凭据。
  - "pnpm-lock.yaml"
  # Playwright 配置属于测试基础设施；Codacy 当前无法解析其类型依赖。
  - "playwright.config.ts"
  - "**/*.e2e.ts"
  - "**/fixtures/**"
  - "**/__fixtures__/**"
  # 迁移是 SQLite 方言，TSQL 规则会误判；迁移由仓库测试执行验证。
  - "modules/server/platform/storage/sqlite/migrations/**"
  # .agents 是 Agent 指令素材与随仓库分发的技能包，不参与源码编译、打包与运行时。
  # 其中的脚本、示例与第三方技能内容由上游维护，本仓库的代码规则不适用。
  - ".agents/**"
