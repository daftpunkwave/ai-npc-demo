name: 缺陷与异常报告 (Bug Report)
description: 提交经过实证检验的代码缺陷、状态机异常、计算错误或回归测试失败
labels: ["kind/bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 缺陷报告准则
        - **标题规范**：`<type>(<scope>): <简明准确且可判定的客观现象>`（例：`fix(authority): 令牌过期后未注销会话导致命令仍被分发`）
        - **实证判断**：推断与事实必须严格分开，严禁仅凭局部表象主观臆测。
        - **独立自解**：禁止引用内部构建阶段编号、未公开草稿或外部不可见路径。
        - **测试闭环**：期望行为必须能直接转化为自动化测试断言。

  - type: dropdown
    id: priority
    attributes:
      label: 优先级 (Priority)
      description: 依据对系统/主干的影响范围硬性匹配对应级别
      options:
        - "priority/P0 - 阻塞主干 / 关键数据损坏 / 进程崩溃（无可用替代方案）"
        - "priority/P1 - 核心特性受损 / 主链路中断（存在临时规避方案）"
        - "priority/P2 - 非核心功能异常 / 边缘分支计算错误 / 局部竞态"
        - "priority/P3 - 次要展示瑕疵 / 状态提示不一致"
        - "priority/P4 - 维护项 / 潜在代码异味"
    validations:
      required: true

  - type: dropdown
    id: confidence
    attributes:
      label: 置信度与证据等级 (Confidence & Evidence)
      description: 反映证据确定性程度，严防无实证的幻觉报警
      options:
        - "confidence/high · evidence/reproduced (实测复现 / 自动化测试失败 / 确凿错误堆栈)"
        - "confidence/medium · evidence/static-analysis (端到端数据流与调用链路闭环推导，未实测)"
        - "confidence/low · evidence/hypothesis (局部静态推导，待进一步验证)"
    validations:
      required: true

  - type: dropdown
    id: realm
    attributes:
      label: 架构领域 (Realm)
      options:
        - "realm/server"
        - "realm/client"
        - "realm/console"
        - "realm/contracts"
        - "realm/shared"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 职能领域 (Area)
      options:
        - "area/agent (认知 / 记忆 / 决策)"
        - "area/authority (命令网关 / 权限策略)"
        - "area/platform (存储 / 运营 / 时钟 / 模型适配)"
        - "area/transport (协议传输 / HTTP-WS)"
        - "area/renderer (场景渲染 / 画布)"
        - "area/kernel (宿主核心 / 装配调度)"
        - "area/tooling (CI 门禁 / 检查脚本)"
    validations:
      required: true

  - type: input
    id: baseline
    attributes:
      label: 代码基线 (Git Baseline)
      description: 提供确切的 Commit SHA 或稳定分支名，防止行号随主干演进漂移
      placeholder: "例如: 5604be5 或 main"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 结论 (Summary)
      description: "[实测 | 静态推断] 核心根因 → 业务受损表现 → 归属边界"
      placeholder: "[实测] 令牌过期后关联会话未注销 → 导致过期会话仍可分发命令 → 定位在 authority 守卫边界"
    validations:
      required: true

  - type: textarea
    id: facts
    attributes:
      label: 现状与客观事实 (Facts & Evidence)
      description: 客观代码定位与实际运行输出。推断与事实必须隔离，未验证项须显式标注。
      placeholder: |
        - 代码位置：`packages/authority/src/guard.ts#L45-L60`
        - 实际表现：
        ```text
        <实测输出 / 报错堆栈 / 失败断言日志>
        ```
        - 静态推导（未验证）：...
    validations:
      required: true

  - type: textarea
    id: impact_and_invariants
    attributes:
      label: 影响范围与受损不变量 (Impact & Invariants)
      description: 触发前置条件、受损主体及被破坏的系统契约/状态不变量。
      placeholder: |
        - 触发前置条件：
        - 受影响主体：
        - 受损系统不变量：
    validations:
      required: true

  - type: textarea
    id: reachability
    attributes:
      label: 复现步骤或调用可达性 (Reachability)
      description: 可运行时提供确定性执行时序；不可运行时提供静态调用链路传递证明。
      placeholder: |
        - 可运行时：
          1. 入口与前置参数：
          2. 触发操作：
          3. 实际异常表现：
        - 不可运行时：
          - 逻辑可达条件：
          - 上游防御未拦截原因：
    validations:
      required: true

  - type: textarea
    id: expected_state
    attributes:
      label: 预期不变量与判定断言 (Expected State & Assertions)
      description: 判定系统行为恢复正常的严格判定条件（以可转化的断言或状态不变量形式描述）。
      placeholder: |
        - 断言 1: expect(session.isValid).toBe(false)
        - 状态不变量: 异常退出后连接与事务必须全部回滚释放，不产生孤儿状态
    validations:
      required: true

  - type: textarea
    id: scope_and_non_goals
    attributes:
      label: 实施边界与非目标 (Scope & Non-Goals)
      description: 修复方向与明确排除的做法（明确划定边界，防止扩大化或破坏规范的偷懒式修改）。
      placeholder: |
        - 实施方向：
        - 非目标（明确不做）：
          * 禁止静默捕获异常（空 catch）
          * 禁止引入未经批准的新外部依赖
          * 禁止绕过命令网关执行直接写入
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 验收判据与回归套件 (Verification & Regression)
      description: 验收此缺陷的自动化执行命令及归属测试套件。
      placeholder: |
        - 回归套件归属：tests/integration/...
        - 自动化验收命令：
        ```bash
        pnpm test tests/integration/...
        ```
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 来源与关联 (Provenance & References)
      description: 发现渠道与关联的公开 Issue / PR 编号（选填）。
      placeholder: "来源：PR #148 审查转出\n关联引用：Issue #120"
    validations:
      required: false
