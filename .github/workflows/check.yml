# 质量门禁：类型检查、测试、边界、模块目录、资源与文档检查。
#
# 核心职责：在每次 push 与 pull request 上执行 `pnpm check`，让仓库既有的质量门禁在远端强制执行。
# 交互契约：读取仓库根的 package.json 脚本链、pnpm-lock.yaml 与 pnpm-workspace.yaml；
#   依赖 Node 24（engines.node 下限）与仓库锁定的 pnpm@12。
# 约束与禁忌：禁止在此跳过检查项、放宽阈值或以 `|| true` 吞掉失败；
#   任何一项检查失败都必须是失败结论。
name: check

on:
  push:
    branches:
      - main
  pull_request:

# 同一分支的新推送取消上一轮未完成的运行，避免排队浪费。
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      # 第三方 action 按完整 commit SHA 固定：tag 可被上游移动，SHA 不可变，
      # 避免同一工作流在不同时间解析到不同代码。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # engines.node 声明运行时下限 >=24；CI 与开发环境一致按 24 执行。
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check
