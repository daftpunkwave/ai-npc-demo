<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">灰痕果园</title>
  <desc id="desc">被水淹没的果园，玻璃诊所温室与红色灯笼在薄雾中发光，水面漂着花瓣。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182a2d"/><stop offset=".55" stop-color="#5b7270"/><stop offset="1" stop-color="#b59a78"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7a72"/><stop offset=".5" stop-color="#2c4643"/><stop offset="1" stop-color="#101f1e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d2c2" stop-opacity=".55"/><stop offset=".55" stop-color="#5c9588" stop-opacity=".4"/><stop offset="1" stop-color="#d9e2d0" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="lantern" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#ffd9a0"/><stop offset=".35" stop-color="#e86a3a" stop-opacity=".8"/><stop offset="1" stop-color="#c33b24" stop-opacity="0"/>
    </radialGradient>
    <filter id="fog"><feTurbulence type="fractalNoise" baseFrequency=".007 .016" numOctaves="4" seed="23"/><feColorMatrix values="0 0 0 0 .65 0 0 0 0 .7 0 0 0 0 .64 0 0 0 .5 0"/><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .05 0 0 0 0 .05 0 0 0 0 .03 0 0 0 .16 0"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <radialGradient id="vig" cx=".5" cy=".45" r=".72"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <g fill="#263b3b" opacity=".45">
    <path d="M0 196h60l20-36 24 36h70l16-22 18 22h82l22-44 26 44h90l18-28 20 28h86l24-38 26 38h80v24H0z"/>
  </g>
  <g opacity=".25" stroke="#e3c69b" stroke-width="2" fill="none">
    <path d="M-20 104c80-18 150 4 240-4s150-16 240 0 160 12 240-2"/>
    <path d="M-20 132c90-12 160 10 250 0s150-12 240 0 140 8 200-2"/>
  </g>

  <!-- 雾中的远处果园行列 -->
  <g stroke="#32463f" stroke-width="4" opacity=".45">
    <path d="M40 236l120-36M120 236l120-36M200 236l120-36M280 236l120-36M360 236l120-36M440 236l120-36M520 236l120-36M600 236l120-36M680 236l120-36"/>
  </g>
  <g fill="#243a34" opacity=".55">
    <path d="M136 206c20-24 44-24 62 0-18 8-44 8-62 0zM256 196c18-22 40-22 58 0-18 8-40 8-58 0zM376 190c20-24 44-24 62 0-18 8-44 8-62 0zM496 196c18-22 40-22 58 0-18 8-40 8-58 0zM616 190c20-24 44-24 62 0-18 8-44 8-62 0z"/>
  </g>

  <!-- 被淹地面 -->
  <rect y="228" width="800" height="222" fill="url(#water)"/>
  <g stroke="#c7d3c2" stroke-opacity=".2" stroke-width="2">
    <path d="M0 242c80 6 150-2 230 2s160 8 250 2 180-6 320 2"/>
    <path d="M0 270c90 4 160-2 250 2s160 6 250 0 170-4 300 4"/>
    <path d="M0 304c80 4 150-2 230 2s160 4 250 0 180-2 320 4"/>
    <path d="M0 350c100 4 170-2 260 2s150 4 250 0 180-2 290 4"/>
  </g>

  <!-- 温室诊所 -->
  <g>
    <path d="M430 274c0-52 36-92 84-92s84 40 84 92v56H430z" fill="url(#glass)" stroke="#8fb7a6" stroke-width="2"/>
    <path d="M514 182v148M430 274h168M458 212l112 116M570 212L458 328" stroke="#a8c6b5" stroke-width="1.5" opacity=".6"/>
    <path d="M430 330h168v10H430z" fill="#1c2b28"/>
    <path d="M448 288h130v30H448z" fill="#203430" opacity=".6"/>
    <g fill="#ffd38a" opacity=".8">
      <rect x="462" y="296" width="18" height="10"/>
      <rect x="496" y="296" width="18" height="10"/>
      <rect x="530" y="296" width="18" height="10"/>
    </g>
    <path d="M506 340v-18h24v18" fill="#192623"/>
    <circle cx="514" cy="172" r="3" fill="#ff7b54"/>
    <path d="M514 172v-22" stroke="#9ab3a1" stroke-width="2"/>
  </g>

  <!-- 前景果树 -->
  <g>
    <path d="M112 352c-8-50 4-92 22-124M244 352c-2-54 6-98 18-130M690 352c-6-48 2-88 18-120" stroke="#201f18" stroke-width="9" stroke-linecap="round"/>
    <path d="M134 236c-26-18-34-42-22-64 18 6 28 24 28 44M134 236c28-10 42-30 38-54-22 2-38 22-38 54M134 236c-2-28 8-48 24-58 6 22-2 44-24 58M262 230c-24-16-30-38-20-58 16 6 26 22 26 40M262 230c26-8 38-28 34-50-20 2-34 20-34 50" fill="#2f463c" stroke="#4f6a58" stroke-width="1" opacity=".9"/>
    <path d="M708 240c-24-14-30-36-18-56 14 6 24 22 24 38M708 240c26-8 38-28 34-50-20 2-34 20-34 50" fill="#2b4138" stroke="#4f6a58" stroke-width="1"/>
  </g>

  <!-- 红灯笼 -->
  <g>
    <path d="M96 282c0 18 10 28 22 28s22-10 22-28-10-28-22-28-22 10-22 28z" fill="#c84a35"/>
    <path d="M96 282h44M118 254v-14M118 310v12" stroke="#4c3228" stroke-width="2"/>
    <circle cx="118" cy="282" r="40" fill="url(#lantern)" opacity=".55"/>
    <path d="M180 300c0 14 8 22 18 22s18-8 18-22-8-22-18-22-18 8-18 22z" fill="#d25a3e"/>
    <path d="M180 300h36M198 278v-12M198 322v10" stroke="#4c3228" stroke-width="2"/>
    <circle cx="198" cy="300" r="30" fill="url(#lantern)" opacity=".45"/>
  </g>

  <!-- 木板路 -->
  <g>
    <path d="M0 376h370v20H0z" fill="#2a2b22"/>
    <path d="M0 376h370v6H0z" fill="#4d4a37"/>
    <g stroke="#151711" stroke-width="2"><path d="M0 390h370M30 396v12m56-12v12m58-12v12m58-12v12m60-12v12m58-12v12"/></g>
    <path d="M370 376l22-56h10l-14 56z" fill="#24261e"/>
  </g>

  <!-- 漂浮花瓣与碎屑 -->
  <g fill="#d9a5a0" opacity=".6">
    <ellipse cx="380" cy="270" rx="8" ry="2" transform="rotate(18 380 270)"/>
    <ellipse cx="410" cy="296" rx="6" ry="1.8" transform="rotate(-12 410 296)"/>
    <ellipse cx="470" cy="260" rx="7" ry="2" transform="rotate(8 470 260)"/>
    <ellipse cx="620" cy="286" rx="9" ry="2.2" transform="rotate(-20 620 286)"/>
    <ellipse cx="660" cy="250" rx="5" ry="1.5"/>
    <ellipse cx="330" cy="316" rx="7" ry="2"/>
  </g>
  <g fill="#1a2420">
    <path d="M330 350c3-10 6-14 9-14s6 4 9 14zM352 352c2-8 5-11 7-11s5 3 7 11z"/>
  </g>

  <rect y="150" width="800" height="210" filter="url(#fog)" opacity=".55"/>
  <rect width="800" height="450" filter="url(#grain)" opacity=".5"/>
  <rect width="800" height="450" fill="url(#vig)"/>
</svg>
