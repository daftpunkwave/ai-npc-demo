<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="泊星者徽记">
  <title>泊星者徽记</title>
  <desc>锚与外星四芒星融合，轨道缆绳伸向夜空。</desc>
  
  <defs>
    <radialGradient id="bg" cx=".45" cy=".35" r=".85"><stop stop-color="#162c44"/><stop offset="1" stop-color="#070d16"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6cdf1"/><stop offset=".5" stop-color="#3f76a6"/><stop offset="1" stop-color="#142c46"/></linearGradient>
    <linearGradient id="anchor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8e9ff"/><stop offset=".55" stop-color="#6d9cc4"/><stop offset="1" stop-color="#27445f"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="66"/><feColorMatrix values="0 0 0 0 .4 0 0 0 0 .7 0 0 0 0 1 0 0 0 .1 0"/></filter>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#bg)" stroke="url(#rim)" stroke-width="6"/>
  <circle cx="128" cy="128" r="96" fill="none" stroke="#2980b9" stroke-width="1.5" opacity=".5"/>
  <g stroke="#73a9d4" stroke-width="1" opacity=".5" fill="none">
    <ellipse cx="128" cy="128" rx="76" ry="28" transform="rotate(-35 128 128)"/>
    <ellipse cx="128" cy="128" rx="64" ry="20" transform="rotate(42 128 128)"/>
  </g>
  <path d="M128 58v104" stroke="url(#anchor)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="128" cy="70" r="16" fill="none" stroke="url(#anchor)" stroke-width="7"/>
  <path d="M96 96h64" stroke="url(#anchor)" stroke-width="7" stroke-linecap="round"/>
  <path d="M84 138c2 30 20 46 44 54 24-8 42-24 44-54" fill="none" stroke="url(#anchor)" stroke-width="7" stroke-linecap="round"/>
  <path d="M84 138l-12-8m12 8l-4-14M172 138l12-8m-12 8l4-14" stroke="#8fb8da" stroke-width="4" stroke-linecap="round"/>
  <path d="M128 176l8 14 16 2-12 10 3 15-15-8-15 8 3-15-12-10 16-2z" fill="#cfe6ff" filter="url(#glow)" opacity=".75"/>
  <path d="M128 176l8 14 16 2-12 10 3 15-15-8-15 8 3-15-12-10 16-2z" fill="#d9ecff"/>
  <g fill="#cfe6ff" opacity=".7"><circle cx="54" cy="86" r="2"/><circle cx="202" cy="96" r="2.5"/><circle cx="70" cy="190" r="1.5"/></g>
  <text x="128" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#a9c8e2">泊星者</text>
  <rect width="256" height="256" filter="url(#g)" opacity=".45"/>
</svg>
