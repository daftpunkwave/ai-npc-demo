schemaVersion: 1
# 章节规则参数：任务随队岗位与数值、日结目标、公社席。
# 规则层只消费这里的描述符；调整名册、道路或数值不需要修改通用规则源码。
tasks:
  # 运输运力 +5 的本派物资支持者（温原）。
  capacitySupporter: { agentId: npc-wenyuan, capacityBonus: 5 }
  # 修复稳定度 +10 的本派工务支持者（陶安）。
  repairSupporter: { agentId: npc-taoan, stabilityBonus: 10 }
  # 救援总用时 −2 的本派医政支持者（慕之）。
  rescueSupporter: { agentId: npc-muzhi, durationDiscountTicks: 2 }
  # 侦察逐路 −1 的本派情报支持者（青庐）。
  scoutSupporter: { agentId: npc-qilu, travelDiscountPerRoad: 1 }
  # 迁徙道路护送 +4 的本派治安支持者（陆沉）。
  escortSupporter: { agentId: npc-luchen, safetyBonus: 4 }
  # 追风：护送与侦察向导对任何队伍同效，不限定本派。
  universalGuide: { agentId: species-fauna, travelDiscountPerRoad: 1 }
  # 洛：非豁免队伍的修复额外 +15，按任务类型固定，不限定本派。
  universalRepairer:
    { agentId: species-extraterrestrial, stabilityBonus: 15, excludedTeamIds: [team-star] }
  # 修复任务的工作节点；库存点必须在该节点或队伍出发节点。
  repairWorkNodeId: grayharbor
  # 只需能源的修复队伍；豁免洛的额外加成，也豁免供给库存点要求。
  energyOnlyRepairTeamIds: [team-star]
  # 修复完成的基础稳定度：普通队伍 25，仅能源队伍 40。
  repairBaseStability: { standard: 25, energyOnly: 40 }
settlement:
  # 每日结算从公社库存扣减的供给量；不足时提交 SupplyShortage。
  dailySupplyStockpileId: sp-commons
  dailySupplyAmount: 6
  # 果园水量归零时从根庭库存扣减的医疗材料量。
  orchardMedicalStockpileId: sp-flora
  orchardMedicalAmount: 5
  # 迁徙安全按这条道路的通行状态与通行许可判定。
  migrationRoadId: r-gh-ps
  migrationPassageFactionId: species-fauna
# 公社席：持有该席位的派系主体控制水闸分配并拥有公开广播权。
watergateSeatId: seat.commune
